[package]
name = "terrafeed"
version = "1.0.0"
description = "Terrafeed — open-source global situational awareness dashboard"
authors = ["Terrafeed contributors"]
license = "MIT"
repository = "https://github.com/OWNER/terrafeed"
edition = "2021"
rust-version = "1.77"

[lib]
name = "terrafeed_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = [
  "rustls-tls",
  "gzip",
  "brotli",
  "charset",
  "http2",
] }
url = "2"
once_cell = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
