<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-label="Terrafeed">
  <defs>
    <linearGradient id="tf-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1626" />
      <stop offset="1" stop-color="#060a12" />
    </linearGradient>
    <linearGradient id="tf-globe" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#5ef2dc" />
      <stop offset="1" stop-color="#2a9bd8" />
    </linearGradient>
    <radialGradient id="tf-pulse" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd27a" />
      <stop offset="1" stop-color="#f59331" />
    </radialGradient>
  </defs>

  <rect width="256" height="256" rx="58" fill="url(#tf-bg)" />

  <!-- planet -->
  <circle cx="128" cy="128" r="66" fill="none" stroke="url(#tf-globe)" stroke-width="11" />
  <circle cx="128" cy="128" r="66" fill="url(#tf-globe)" opacity="0.1" />

  <!-- data stream in orbit: dashed = a feed, not a border -->
  <g transform="rotate(-22 128 128)">
    <ellipse cx="128" cy="128" rx="96" ry="34" fill="none" stroke="url(#tf-globe)"
             stroke-width="9" stroke-linecap="round" stroke-dasharray="26 20" opacity="0.95" />
  </g>

  <!-- live signal -->
  <circle cx="196" cy="86" r="24" fill="#060a12" />
  <circle cx="196" cy="86" r="15" fill="url(#tf-pulse)" />
</svg>
